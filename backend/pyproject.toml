[project]
name = "festivo-ai-backend"
version = "0.8.0"
description = "Secure FastAPI backend for Festivo AI event planning and budgets."
readme = "README.md"
requires-python = ">=3.12,<3.16"
dependencies = [
    "fastapi==0.160.0",
    "firebase-admin==7.1.0",
    "google-genai==1.2.0",
    "pydantic==2.14.1",
    "psycopg==3.3.6",
    "psycopg-binary==3.3.6",
    "psycopg-pool==3.3.1",
    "pydantic-settings==2.16.1",
    "PyJWT==2.10.1",
    "python-dotenv==1.2.4",
    "reportlab==5.1.0",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.16.0",
    "mypy==1.15.0",
    "pypdf==6.21.2",
    "pytest==9.1.1",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.0.0",
    "ruff==0.17.1",
    "types-PyYAML==6.0.12.20241230",
    "types-requests==2.32.0.20241016",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=100"
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "S",
    "C4",
    "PTH",
    "RUF",
    "N",
    "A",
    "RET",
    "ARG",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "T20",
    "DTZ",
    "TID",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "PLR2004", "ARG001", "ARG002", "PLR0913", "PLR0917", "PLR0912", "RET504", "RET505", "DTZ001", "PLC0415"]
# S608: parameterized SQL; table/column identifiers can never be user-supplied.
"app/repositories/postgres_event_repository.py" = ["S608"]
"app/repositories/postgres_budget_repository.py" = ["S608"]
"app/repositories/postgres_planning_repository.py" = ["S608"]
"app/repositories/postgres_proposal_repository.py" = ["S608"]
"app/repositories/postgres_vendor_repository.py" = ["S608"]
# PLR0913 is the only structural exception in app/: DI-rich wiring is intentional,
# and every signature was made keyword-only so positional counts stay small (PLR0917 clean).
"app/services/*" = ["PLR0913"]
"app/services/ai/*" = ["PLR0913"]
"app/api/*" = ["PLR0913"]
"scripts/*" = ["S101", "T201"]
"app/repositories/*" = ["PLR0913"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "firebase_admin.*",
    "google.*",
    "reportlab.*",
    "psycopg.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
