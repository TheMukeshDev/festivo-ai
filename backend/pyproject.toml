[project]
name = "festivo-ai-backend"
version = "0.8.0"
description = "Secure FastAPI backend for Festivo AI event planning and budgets."
readme = "README.md"
requires-python = ">=3.12,<3.16"
dependencies = [
    "fastapi==0.160.0",
    "firebase-admin==7.1.0",
    "google-genai==1.2.0",
    "pydantic==2.14.1",
    "psycopg==3.3.6",
    "psycopg-binary==3.3.6",
    "psycopg-pool==3.3.1",
    "pydantic-settings==2.16.1",
    "PyJWT==2.10.1",
    "python-dotenv==1.2.4",
    "reportlab==5.1.0",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.16.0",
    "pypdf==6.21.2",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "S", "C4", "PTH", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"app/repositories/postgres_event_repository.py" = ["S608"]
"app/repositories/postgres_budget_repository.py" = ["S608"]
"app/repositories/postgres_planning_repository.py" = ["S608"]
"app/repositories/postgres_proposal_repository.py" = ["S608"]
"app/repositories/postgres_vendor_repository.py" = ["S608"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
